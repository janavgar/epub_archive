[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-archive"
version = "0.1.0"
description = "Local pipeline for extracting, classifying, and searching EPUB books"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "EbookLib>=0.18",
    "requests>=2.31",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
epub-archive = "epub_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
